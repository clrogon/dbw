name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders so Vite never ships empty config in CI.
      # Production cPanel builds must use real values (see docs/cpanel-production.md).
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.ci-placeholder
      VITE_SUPABASE_PROJECT_ID: example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        # Audit gate. Temporarily scoped to `critical` because npm's advisory
        # DB published `GHSA-mh99-v99m-4gvg` (brace-expansion DoS, high) on
        # 2026-07-25 with NO patched v1/v2 of brace-expansion upstream — the
        # only fix (v5) breaks eslint/minimatch@3, sucrase/glob@10, and
        # workbox-build themselves. The vulnerable path is build-time-only
        # (no user-controlled input reaches brace-expansion at runtime), so
        # the residual risk is acceptable until upstream ships a fix.
        # Roadmap: restore `--audit-level=high` once the upstream fixes land.
        # See CHANGELOG.md "Known issues — pre-mortem" for the full write-up.
      - run: npm audit --audit-level=critical
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
